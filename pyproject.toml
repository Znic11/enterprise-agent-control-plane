[project]
name = "EnterpriseOps-Gym"
version = "0.1.0"
description = "Benchmarking framework for evaluating LLMs on enterprise agentic tasks."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "ray>=2.53.0",
    "datasets>=4.5.0",
    "huggingface_hub>=1.3.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.40.0",
    "langchain-aws>=1.4.1",
    "boto3>=1.28.0",
]
openai = [
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
]
google = [
    "langchain-google-genai>=0.1.0",
    "langchain-google-vertexai>=1.0.0",
    "google-cloud-aiplatform>=1.40.0",
]
deepseek = [
    "langchain-deepseek>=0.1.0",
]
qwq = [
    "langchain-qwq>=0.1.0",
]
# 稠密向量检索(meta_tool 检索后端 dense/hybrid 需要;torch 建议 CPU 版即可)
# 安装: pip install '.[dense]'   或   uv sync --extra dense
dense = [
    "sentence-transformers>=2.7.0",
    "torch>=2.0.0",
]
all = [
    "EnterpriseOps-Gym[anthropic,openai,google,deepseek,qwq,dense]",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0.0",
    "ipython>=8.0.0",
    "matplotlib>=3.7.0",
]

[tool.uv]
package = false

# ---- 打包配置(仅对 `pip install -e .` / `uv pip install -e '.[x]'` 生效)----
# 项目本质是"非包"工具仓库([tool.uv] package=false,标准流程 uv sync 只装依赖);
# 但用户可能习惯性执行 `pip install -e .`,此时 setuptools flat-layout 自动发现会把
# conf/data/logs/assets/results/orchestrators 等顶层目录(乃至误建的 ls/list 垃圾文件)
# 全部当成候选包 → "Multiple top-level packages discovered" 构建失败。
# 因此显式声明包发现范围,只纳入真正作为包 import 的目录。
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["benchmark*", "orchestrators*", "utils*"]
